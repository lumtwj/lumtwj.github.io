<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="A screen with a play button above a row of episode bars, watched episodes lit and the current one glowing">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#12151b"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
    <radialGradient id="glow6" cx="0.7" cy="1" r="0.8">
      <stop offset="0" stop-color="#46c1ea" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#46c1ea" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft6" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg6)"/>
  <rect width="800" height="500" fill="url(#glow6)"/>

  <!-- The screen: whatever's playing in Chrome right now -->
  <rect x="220" y="56" width="360" height="210" rx="14" fill="#0e1216" stroke="#46c1ea" stroke-opacity="0.4" stroke-width="3"/>
  <circle cx="400" cy="161" r="40" fill="#46c1ea" opacity="0.18" filter="url(#soft6)"/>
  <circle cx="400" cy="161" r="34" fill="none" stroke="#46c1ea" stroke-width="4"/>
  <path d="M388 143v36l30 -18z" fill="#46c1ea"/>
  <!-- Scrubber, paused partway through -->
  <rect x="248" y="238" width="304" height="6" rx="3" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="248" y="238" width="196" height="6" rx="3" fill="#46c1ea"/>
  <circle cx="444" cy="241" r="8" fill="#f1f1ed"/>

  <!-- Season label: exactly where you left off -->
  <g fill="#ffffff" fill-opacity="0.14">
    <rect x="72" y="300" width="96" height="12" rx="6"/>
    <rect x="182" y="300" width="56" height="12" rx="6"/>
  </g>
  <rect x="640" y="300" width="96" height="12" rx="6" fill="#46c1ea" fill-opacity="0.85"/>

  <!-- Episode bars: watched, current, still to come -->
  <g fill="#eaeff7" fill-opacity="0.75">
    <rect x="72" y="336" width="24" height="104" rx="3"/>
    <rect x="104" y="336" width="24" height="104" rx="3"/>
    <rect x="136" y="336" width="24" height="104" rx="3"/>
    <rect x="168" y="336" width="24" height="104" rx="3"/>
    <rect x="200" y="336" width="24" height="104" rx="3"/>
    <rect x="232" y="336" width="24" height="104" rx="3"/>
    <rect x="264" y="336" width="24" height="104" rx="3"/>
    <rect x="296" y="336" width="24" height="104" rx="3"/>
    <rect x="328" y="336" width="24" height="104" rx="3"/>
    <rect x="360" y="336" width="24" height="104" rx="3"/>
    <rect x="392" y="336" width="24" height="104" rx="3"/>
    <rect x="424" y="336" width="24" height="104" rx="3"/>
  </g>
  <rect x="452" y="320" width="32" height="136" rx="6" fill="#46c1ea" opacity="0.3" filter="url(#soft6)"/>
  <rect x="456" y="336" width="24" height="104" rx="3" fill="#46c1ea"/>
  <g fill="#ffffff" fill-opacity="0.1">
    <rect x="488" y="336" width="24" height="104" rx="3"/>
    <rect x="520" y="336" width="24" height="104" rx="3"/>
    <rect x="552" y="336" width="24" height="104" rx="3"/>
    <rect x="584" y="336" width="24" height="104" rx="3"/>
    <rect x="616" y="336" width="24" height="104" rx="3"/>
    <rect x="648" y="336" width="24" height="104" rx="3"/>
    <rect x="680" y="336" width="24" height="104" rx="3"/>
    <rect x="712" y="336" width="24" height="104" rx="3"/>
  </g>
  <path d="M0 456h800" stroke="#46c1ea" stroke-opacity="0.3" stroke-width="3"/>
</svg>
