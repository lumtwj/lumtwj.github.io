<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="A seven-day week grid with task blocks, one lifted mid-drag">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#12151b"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#35d6c4" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#35d6c4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- Faint void-deck tile grid behind the calendar -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 60H800M0 140H800M0 220H800M0 300H800M0 380H800M0 460H800"/>
    <path d="M80 0V500M160 0V500M240 0V500M320 0V500M400 0V500M480 0V500M560 0V500M640 0V500M720 0V500"/>
  </g>

  <!-- Week header: seven day caps -->
  <g fill="#35d6c4" fill-opacity="0.55">
    <rect x="72"  y="96" width="34" height="6" rx="3"/>
    <rect x="172" y="96" width="34" height="6" rx="3"/>
    <rect x="272" y="96" width="34" height="6" rx="3"/>
    <rect x="372" y="96" width="34" height="6" rx="3"/>
    <rect x="472" y="96" width="34" height="6" rx="3"/>
    <rect x="572" y="96" width="34" height="6" rx="3"/>
    <rect x="672" y="96" width="34" height="6" rx="3"/>
  </g>

  <!-- Seven day columns -->
  <g fill="#ffffff" fill-opacity="0.03" stroke="#35d6c4" stroke-opacity="0.22">
    <rect x="60"  y="120" width="80" height="300" rx="10"/>
    <rect x="160" y="120" width="80" height="300" rx="10"/>
    <rect x="260" y="120" width="80" height="300" rx="10"/>
    <rect x="360" y="120" width="80" height="300" rx="10"/>
    <rect x="460" y="120" width="80" height="300" rx="10"/>
    <rect x="560" y="120" width="80" height="300" rx="10"/>
    <rect x="660" y="120" width="80" height="300" rx="10"/>
  </g>

  <!-- Scheduled task blocks -->
  <g>
    <rect x="70"  y="136" width="60" height="34" rx="7" fill="#35d6c4" fill-opacity="0.85"/>
    <rect x="70"  y="180" width="60" height="22" rx="7" fill="#35d6c4" fill-opacity="0.35"/>
    <rect x="170" y="136" width="60" height="22" rx="7" fill="#35d6c4" fill-opacity="0.35"/>
    <rect x="270" y="136" width="60" height="46" rx="7" fill="#1f9f92" fill-opacity="0.8"/>
    <rect x="270" y="192" width="60" height="22" rx="7" fill="#35d6c4" fill-opacity="0.3"/>
    <rect x="470" y="136" width="60" height="30" rx="7" fill="#35d6c4" fill-opacity="0.55"/>
    <rect x="570" y="136" width="60" height="22" rx="7" fill="#35d6c4" fill-opacity="0.3"/>
    <rect x="570" y="168" width="60" height="34" rx="7" fill="#1f9f92" fill-opacity="0.7"/>
    <rect x="670" y="136" width="60" height="26" rx="7" fill="#35d6c4" fill-opacity="0.4"/>
  </g>

  <!-- Recurring markers: the same task repeating across the week -->
  <g stroke="#ffab53" stroke-opacity="0.75" stroke-width="2.5" fill="none" stroke-linecap="round">
    <g transform="translate(76 340)">
      <path d="M0 10a10 10 0 1 1 3 7"/><path d="M-1 0v10h10"/>
    </g>
    <g transform="translate(276 340)">
      <path d="M0 10a10 10 0 1 1 3 7"/><path d="M-1 0v10h10"/>
    </g>
    <g transform="translate(576 340)">
      <path d="M0 10a10 10 0 1 1 3 7"/><path d="M-1 0v10h10"/>
    </g>
  </g>
  <g stroke="#ffab53" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 8">
    <path d="M76 350h500"/>
  </g>

  <!-- The dragged task: empty slot it left, and the lifted card -->
  <rect x="370" y="136" width="60" height="34" rx="7" fill="none" stroke="#35d6c4" stroke-opacity="0.5" stroke-dasharray="5 5"/>
  <g filter="url(#soft)" opacity="0.5">
    <rect x="352" y="212" width="96" height="46" rx="9" fill="#35d6c4"/>
  </g>
  <g transform="rotate(-4 400 235)">
    <rect x="352" y="212" width="96" height="46" rx="9" fill="#0e1216" stroke="#35d6c4" stroke-width="2"/>
    <rect x="364" y="226" width="52" height="6" rx="3" fill="#35d6c4"/>
    <rect x="364" y="240" width="34" height="5" rx="2.5" fill="#35d6c4" fill-opacity="0.45"/>
  </g>
  <!-- Cursor -->
  <path d="M444 250l26 22-11 2 6 14-7 3-6-14-9 6z" fill="#f1f1ed"/>

  <!-- Someday list, undated, parked at the bottom -->
  <g>
    <rect x="60" y="444" width="200" height="8" rx="4" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="60" y="444" width="86" height="8" rx="4" fill="#ffab53" fill-opacity="0.7"/>
  </g>
</svg>
