<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="A countdown ring closing in on ORD, with days struck off a calendar">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#12151b"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
    <radialGradient id="glow4" cx="0.32" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#35d6c4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#35d6c4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft4" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg4)"/>
  <rect width="800" height="500" fill="url(#glow4)"/>

  <!-- Countdown ring: mostly served, a sliver left -->
  <g transform="translate(260 250)">
    <circle r="132" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="18"/>
    <g filter="url(#soft4)" opacity="0.55">
      <circle r="132" fill="none" stroke="#35d6c4" stroke-width="18" stroke-linecap="round"
              stroke-dasharray="663 829" transform="rotate(-90)"/>
    </g>
    <circle r="132" fill="none" stroke="#35d6c4" stroke-width="18" stroke-linecap="round"
            stroke-dasharray="663 829" transform="rotate(-90)"/>
    <!-- Countdown readout -->
    <text x="0" y="6" text-anchor="middle" font-family="ui-monospace, monospace" font-size="74"
          font-weight="700" fill="#f1f1ed" letter-spacing="2">128</text>
    <text x="0" y="46" text-anchor="middle" font-family="ui-monospace, monospace" font-size="20"
          fill="#35d6c4" letter-spacing="6">DAYS TO ORD</text>
  </g>

  <!-- Calendar: days struck off toward the finish -->
  <g transform="translate(470 130)">
    <rect x="0" y="0" width="250" height="240" rx="14" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="0" y="0" width="250" height="34" rx="14" fill="#35d6c4" fill-opacity="0.18"/>
    <rect x="0" y="24" width="250" height="10" fill="#0e1116" fill-opacity="0"/>
    <g fill="#ffffff" fill-opacity="0.16">
      <rect x="24"  y="58"  width="26" height="26" rx="6"/><rect x="70"  y="58"  width="26" height="26" rx="6"/>
      <rect x="116" y="58"  width="26" height="26" rx="6"/><rect x="162" y="58"  width="26" height="26" rx="6"/>
      <rect x="208" y="58"  width="26" height="26" rx="6"/>
      <rect x="24"  y="104" width="26" height="26" rx="6"/><rect x="70"  y="104" width="26" height="26" rx="6"/>
      <rect x="116" y="104" width="26" height="26" rx="6"/><rect x="162" y="104" width="26" height="26" rx="6"/>
      <rect x="208" y="104" width="26" height="26" rx="6"/>
      <rect x="24"  y="150" width="26" height="26" rx="6"/><rect x="70"  y="150" width="26" height="26" rx="6"/>
      <rect x="116" y="150" width="26" height="26" rx="6"/><rect x="162" y="150" width="26" height="26" rx="6"/>
      <rect x="208" y="150" width="26" height="26" rx="6"/>
      <rect x="24"  y="196" width="26" height="26" rx="6"/><rect x="70"  y="196" width="26" height="26" rx="6"/>
      <rect x="116" y="196" width="26" height="26" rx="6"/>
    </g>
    <!-- Chopped days -->
    <g stroke="#35d6c4" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round">
      <path d="M26 82l22-22"/><path d="M72 82l22-22"/><path d="M118 82l22-22"/><path d="M164 82l22-22"/><path d="M210 82l22-22"/>
      <path d="M26 128l22-22"/><path d="M72 128l22-22"/><path d="M118 128l22-22"/><path d="M164 128l22-22"/><path d="M210 128l22-22"/>
      <path d="M26 174l22-22"/><path d="M72 174l22-22"/><path d="M118 174l22-22"/>
    </g>
    <!-- ORD day, circled in amber -->
    <rect x="162" y="196" width="26" height="26" rx="6" fill="#ffab53" fill-opacity="0.85"/>
    <circle cx="175" cy="209" r="21" fill="none" stroke="#ffab53" stroke-width="3"/>
  </g>

  <!-- Progress bar along the bottom -->
  <g transform="translate(60 432)">
    <rect width="680" height="10" rx="5" fill="#ffffff" fill-opacity="0.1"/>
    <rect width="544" height="10" rx="5" fill="#35d6c4" fill-opacity="0.9"/>
    <circle cx="544" cy="5" r="9" fill="#0a0c10" stroke="#35d6c4" stroke-width="3"/>
    <text x="680" y="-14" text-anchor="end" font-family="ui-monospace, monospace" font-size="16"
          fill="#ffab53" letter-spacing="4">ORD LOH!</text>
  </g>
</svg>
