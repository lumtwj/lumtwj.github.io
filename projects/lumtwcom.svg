<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Lit HDB blocks at night with a camera path sweeping through the heartlands">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161a24"/>
      <stop offset="0.6" stop-color="#0d1016"/>
      <stop offset="1" stop-color="#08090c"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff425f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff425f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg3)"/>
  <circle cx="620" cy="120" r="150" fill="url(#moon)"/>
  <circle cx="620" cy="120" r="34" fill="#ffe2c4" opacity="0.85"/>

  <!-- Stars -->
  <g fill="#f1f1ed" fill-opacity="0.5">
    <circle cx="90" cy="70" r="2"/><circle cx="190" cy="46" r="1.5"/><circle cx="286" cy="96" r="2"/>
    <circle cx="380" cy="52" r="1.5"/><circle cx="470" cy="88" r="2"/><circle cx="736" cy="60" r="1.5"/>
  </g>

  <!-- Far blocks -->
  <g fill="#12161e">
    <rect x="40"  y="210" width="90"  height="230"/>
    <rect x="150" y="250" width="70"  height="190"/>
    <rect x="640" y="230" width="120" height="210"/>
  </g>

  <!-- Near HDB slabs with lit windows -->
  <g fill="#0b0e14" stroke="#ff425f" stroke-opacity="0.2">
    <rect x="240" y="150" width="130" height="290"/>
    <rect x="400" y="196" width="110" height="244"/>
    <rect x="536" y="120" width="86"  height="320"/>
  </g>
  <g fill="#ffab53">
    <g fill-opacity="0.85">
      <rect x="258" y="172" width="18" height="14"/><rect x="298" y="172" width="18" height="14"/>
      <rect x="334" y="204" width="18" height="14"/><rect x="258" y="236" width="18" height="14"/>
      <rect x="298" y="268" width="18" height="14"/><rect x="334" y="300" width="18" height="14"/>
      <rect x="258" y="332" width="18" height="14"/><rect x="298" y="364" width="18" height="14"/>
      <rect x="418" y="220" width="18" height="14"/><rect x="474" y="252" width="18" height="14"/>
      <rect x="418" y="316" width="18" height="14"/><rect x="474" y="380" width="18" height="14"/>
      <rect x="554" y="146" width="18" height="14"/><rect x="590" y="210" width="18" height="14"/>
      <rect x="554" y="274" width="18" height="14"/><rect x="590" y="338" width="18" height="14"/>
    </g>
    <g fill-opacity="0.3">
      <rect x="334" y="172" width="18" height="14"/><rect x="298" y="204" width="18" height="14"/>
      <rect x="258" y="268" width="18" height="14"/><rect x="334" y="364" width="18" height="14"/>
      <rect x="474" y="220" width="18" height="14"/><rect x="418" y="252" width="18" height="14"/>
      <rect x="474" y="316" width="18" height="14"/><rect x="590" y="146" width="18" height="14"/>
      <rect x="554" y="210" width="18" height="14"/><rect x="590" y="274" width="18" height="14"/>
    </g>
  </g>

  <!-- Ground and void deck -->
  <rect x="0" y="440" width="800" height="60" fill="#0a0c10"/>
  <path d="M0 440h800" stroke="#35d6c4" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Scroll-driven camera path sweeping through the estate -->
  <g filter="url(#soft3)" opacity="0.65">
    <path d="M-20 470C160 470 200 330 400 330s260 90 430 40" fill="none" stroke="#ff425f" stroke-width="6"/>
  </g>
  <path d="M-20 470C160 470 200 330 400 330s260 90 430 40" fill="none" stroke="#ff425f" stroke-width="2.5" stroke-opacity="0.9"/>
  <circle cx="400" cy="330" r="7" fill="#f1f1ed"/>
  <circle cx="400" cy="330" r="16" fill="none" stroke="#ff425f" stroke-opacity="0.7" stroke-width="2"/>

  <!-- Street lamp -->
  <g stroke="#35d6c4" stroke-opacity="0.55" stroke-width="3" fill="none">
    <path d="M148 440V326h34"/>
  </g>
  <circle cx="186" cy="326" r="6" fill="#35d6c4"/>
  <path d="M186 332l30 108h-60z" fill="#35d6c4" opacity="0.12"/>
</svg>
